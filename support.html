  <title>Rainora · Technical Support</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1522;
      --panel: rgba(19, 37, 55, .78);
      --text: #edf7f6;
      --muted: #a9c1c2;
      --line: rgba(185, 224, 218, .16);
      --accent: #91ddd0;
      --accent-strong: #b7f1e5;
      --shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(70, 137, 151, .28), transparent 34rem),
        radial-gradient(circle at 92% 18%, rgba(69, 111, 143, .2), transparent 28rem),
        linear-gradient(145deg, #0b1522 0%, #10283a 52%, #0b1725 100%);
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--accent-strong); }
    a:hover { color: #fff; }
    .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }

    header { padding: 22px 0 86px; border-bottom: 1px solid var(--line); }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand {
      display: inline-flex; align-items: center; gap: 11px; color: var(--text);
      font-size: 20px; font-weight: 700; letter-spacing: .02em; text-decoration: none;
    }
    .brand-mark {
      display: grid; width: 38px; height: 38px; place-items: center;
      border: 1px solid rgba(183, 241, 229, .42); border-radius: 13px;
      color: #0e2732; background: linear-gradient(145deg, var(--accent-strong), #65b9c0);
      box-shadow: 0 8px 24px rgba(87, 199, 194, .18); font-size: 19px;
    }
    .lang { display: inline-flex; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(10, 24, 36, .48); }
    .lang button {
      border: 0; border-radius: 999px; padding: 7px 11px; color: var(--muted);
      background: transparent; cursor: pointer; font: inherit; font-size: 13px;
    }
    .lang button[aria-pressed="true"] { color: #09212b; background: var(--accent); }

    .hero { max-width: 760px; padding-top: 74px; }
    .eyebrow { margin: 0 0 13px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { max-width: 740px; margin: 0; font-size: clamp(38px, 7vw, 70px); letter-spacing: -.045em; }
    .hero p { max-width: 650px; margin: 22px 0 0; color: var(--muted); font-size: clamp(17px, 2vw, 20px); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 46px;
      padding: 10px 18px; border: 1px solid rgba(183, 241, 229, .42); border-radius: 12px;
      color: #08212a; background: var(--accent); font-weight: 700; text-decoration: none;
    }
    .button.secondary { color: var(--text); background: rgba(255, 255, 255, .05); border-color: var(--line); }
    .button:hover { color: #061b23; background: #c9fff4; text-decoration: none; }
    .button.secondary:hover { color: #fff; background: rgba(255, 255, 255, .11); }

    main { padding: 58px 0 78px; }
    .section { margin-top: 58px; }
    .section:first-child { margin-top: 0; }
    .section-heading { max-width: 700px; margin-bottom: 22px; }
    h2 { margin: 0 0 10px; font-size: clamp(27px, 4vw, 38px); letter-spacing: -.025em; }
    .section-heading p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .card { padding: 23px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); }
    .card h3 { margin: 0 0 9px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); }
    .icon { margin-bottom: 12px; color: var(--accent); font-size: 25px; }

    .faq { display: grid; gap: 11px; }
    details { border: 1px solid var(--line); border-radius: 14px; background: rgba(19, 37, 55, .64); }
    summary { padding: 17px 20px; cursor: pointer; list-style: none; font-weight: 700; }
    summary::-webkit-details-marker { display: none; }
    summary::after { float: right; color: var(--accent); content: "+"; font-size: 21px; line-height: 1; }
    details[open] summary::after { content: "−"; }
    details p { margin: 0; padding: 0 20px 19px; color: var(--muted); }

    .contact { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; align-items: stretch; }
    .contact-main {
      padding: 30px; border: 1px solid rgba(145, 221, 208, .25); border-radius: 22px;
      background: linear-gradient(135deg, rgba(36, 77, 91, .82), rgba(20, 43, 60, .86));
    }
    .contact-main h2 { margin-bottom: 13px; }
    .contact-main p { max-width: 620px; margin: 0 0 20px; color: var(--muted); }
    .email { display: inline-block; padding: 11px 15px; border-radius: 11px; color: var(--accent-strong); background: rgba(5, 20, 29, .38); font-weight: 700; text-decoration: none; }
    .contact-note { padding: 26px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); }
    .contact-note h3 { margin-top: 0; }
    .contact-note p { margin-bottom: 0; color: var(--muted); }
    footer { padding: 25px 0 35px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer p { margin: 0; }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 28px, 620px); }
      header { padding-bottom: 60px; }
      .hero { padding-top: 58px; }
      .grid, .contact { grid-template-columns: 1fr; }
      .card, .contact-main, .contact-note { padding: 20px; }
      .lang { max-width: 62vw; overflow-x: auto; }
      .lang button { flex: 0 0 auto; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>

    function readLanguage() {
      const params = new URLSearchParams(window.location.search);
      const requested = (params.get('lang') || params.get('language') || 'en').toLowerCase();
      return languages.includes(requested) ? requested : 'en';
    }

    function getValue(data, path) {
      return path.split('.').reduce((value, key) => value == null ? '' : value[key], data);
    }

    function render(language, updateUrl) {
      const data = copy[language];
      document.documentElement.lang = data.htmlLang;
      document.title = data.title;
      document.querySelectorAll('[data-text]').forEach((element) => {
        element.textContent = getValue(data, element.dataset.text);
      });
      document.querySelectorAll('[data-html]').forEach((element) => {
        element.innerHTML = getValue(data, element.dataset.html);
      });
      document.querySelectorAll('[data-language]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.language === language));
      });
      const email = document.getElementById('emailLink');
      email.href = `mailto:${EMAIL}?subject=${encodeURIComponent(`${data.title} - Support`)}`;
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', language);
        window.history.replaceState({}, '', url);
      }
    }

    document.querySelectorAll('[data-language]').forEach((button) => {
      button.addEventListener('click', () => render(button.dataset.language, true));
    });
    render(readLanguage(), false);
  </script>
